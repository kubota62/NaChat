# Compose 2.24.4+ required for !override. Configure .env hosts/origins first.
services:
  app:
    environment:
      SECURE_COOKIES: '1'
  proxy:
    ports: !override
      - '443:443'
    volumes:
      - ./infra/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
